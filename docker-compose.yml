services:
  kafka-practice-producer:
    image: kafka-practice-producer:latest
    container_name: kafka-practice-producer-dock-cont
    depends_on:
      - kafka-cont
    environment:
      KAFKA_HOST: kafka-cont:29092
    ports:
      - "8080:8080"
    networks:
      - backend-net
#  kafka-practice-client:
#    image: kafka-practice-client:latest
#    container_name: kafka-practice-client-dock-cont
#    networks:
#      - backend-net
#    depends_on:
#      - kafka
  kafka-cont:
    image: apache/kafka:4.2.0
    container_name: kafka-cont
    environment:
      # Configure KRaft mode (No ZooKeeper required)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-cont:29093'

      # Configure Listeners for internal Docker communication and external host communication
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-cont:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'

      # Setup log directories and cluster ID
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - "9092:9092"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 5
