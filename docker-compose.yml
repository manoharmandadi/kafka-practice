services:
  kafka-practice-producer:
    image: kafka-practice-producer:latest
    container_name: kafka-practice-producer-dock-cont
    depends_on:
      - kafka-cont
#    environment:
#      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-cont
    ports:
      - "8080:8080"
    networks:
      - backend-net
#  kafka-practice-client:
#    image: kafka-practice-client:latest
#    container_name: kafka-practice-client-dock-cont
#    networks:
#      - backend-net
#    depends_on:
#      - kafka
  kafka-cont:
    image: apache/kafka:4.2.0
    container_name: kafka-cont
    environment:
      CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      CONTROLLER_LISTENER_NAMES: CONTROLLER
      LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      PROCESS_ROLES: broker,controller
      NODE_ID: 1
      LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 5
